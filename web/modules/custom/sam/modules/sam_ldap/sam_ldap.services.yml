services:
  sam_ldap.connection:
    class: Drupal\sam_ldap\Service\LdapConnectionService
    arguments:
      - '@logger.factory'
      - '@key.repository'

  sam_ldap.authentication:
    class: Drupal\sam_ldap\Service\LdapAuthenticationService
