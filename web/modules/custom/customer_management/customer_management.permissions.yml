access customer management:
  title: 'Access customer management'
  description: 'View the custom customer management pages.'

create customer:
  title: 'Create customers'
  description: 'Create customer records through the custom customer management form.'

edit customer:
  title: 'Edit customers'
  description: 'Edit customer records through the custom customer management form.'

resend customer credentials:
  title: 'Resend customer credentials'
  description: 'Allows a user to resend the current Client ID and hashed key to the customer contact email without displaying the key in the UI.'
  restrict access: true

reset customer hashed key:
  title: 'Reset customer hashed key'
  description: 'Allows a user to invalidate a customer''s current hashed key and generate a new one. This immediately breaks any hashes computed with the old key. Restrict this to trusted admin roles only.'
  restrict access: true
