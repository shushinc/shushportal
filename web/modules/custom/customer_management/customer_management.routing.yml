customer_management.list_customer:
  path: '/client/customers'
  defaults:
    _controller: '\Drupal\customer_management\Controller\CustomerListController::list'
    _title: 'Customer Management'
  requirements:
    _permission: 'access customer management'
  options:
    no_cache: true

customer_management.add_customer:
  path: '/customers/add'
  defaults:
    _form: '\Drupal\customer_management\Form\CreateCustomerForm'
    _title: 'Add Customer'
  requirements:
    _permission: 'create customer'
  options:
    no_cache: true

customer_management.edit_customer:
  path: '/customers/{node}/edit'
  defaults:
    _form: '\Drupal\customer_management\Form\CreateCustomerForm'
    _title: 'Edit Customer'
  requirements:
    _permission: 'edit customer'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
    no_cache: true

customer_management.resend_credentials:
  path: '/customer/{node}/resend-credentials'
  defaults:
    _form: '\Drupal\customer_management\Form\ResendCredentialsForm'
    _title: 'Resend credentials'
  requirements:
    _permission: 'resend customer credentials'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
    no_cache: true

customer_management.reset_key:
  path: '/customer/{node}/reset-key'
  defaults:
    _form: '\Drupal\customer_management\Form\ResetHashedKeyForm'
    _title: 'Reset hashed key'
  requirements:
    _permission: 'reset customer hashed key'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
    no_cache: true
